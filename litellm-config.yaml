# Alias -> provider map for the LiteLLM gateway.
#
# Applications only ever send an alias. To move a workload onto a different
# provider, change litellm_params here and restart this service — no app rebuild.
#
# IMPORTANT: two entries sharing a model_name is NOT an override, it declares a
# load-balancing group and requests will round-robin between them. Local variants
# therefore use a distinct '-local' alias.
#
# MODEL TIER IS PART OF THE CONTRACT. An alias must resolve to the same tier the
# call site uses today, or the migration silently re-prices and re-times a
# workload while claiming to be a no-op. Three workloads run on haiku today and
# are marked below with the setting they mirror. Do not "simplify" them onto the
# sonnet default.

model_list:
  # Haiku, because Settings.INTAKE_JD_MODEL was claude-haiku-4-5-20251001 before
  # it was flipped to this alias. The setting now holds the alias, so this entry
  # is the only remaining record of the tier it has to preserve.
  - model_name: intake-jd
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: intake-jd-local
    litellm_params:
      model: ollama_chat/gemma4:latest
      api_base: os.environ/OLLAMA_API_BASE
    model_info: {supports_function_calling: false}

  - model_name: debrief-chat
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # The backend's TEXT intake turn loop, phase 3's main streaming site. Its model
  # id is hardcoded at backend/app/api/v2/routers/intake_text_messages.py
  # (claude-sonnet-4-6), and that one variable feeds BOTH the streamed turn and
  # the coverage tracker spawned beside it, so both move onto this alias together.
  # Distinct from voice-intake on purpose: same job, different transport, and
  # tying them together would mean a voice tuning change silently re-tiers text.
  - model_name: intake-text
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # workers/intake-context-builder parse_jd. SONNET — settings.py reads
  # ANTHROPIC_MODEL_SONNET (claude-sonnet-4-6). It must NOT reuse `intake-jd`,
  # which is HAIKU and belongs to the backend's JD extract: that swap would look
  # like a tidy-up and would quietly re-tier a sonnet workload onto haiku, which
  # is exactly what this file's header forbids. Sibling of context-synthesize.
  - model_name: context-parse-jd
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: screening-generator
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: screening-assessor
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: persona-reduce
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: route-intent
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: signal-extract
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: resume-extract
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # Haiku today: Settings.CANDIDATE_DETECT_MODEL in backend/app/config.py, whose current
  # value is claude-3-5-haiku-latest. Pinned to the same haiku tier as the other
  # two rather than to a floating '-latest' tag, so the alias is reproducible.
  - model_name: candidate-detect
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # Haiku today: backend/app/services/intake/parse_intent_service.py:103, where
  # the model id is hardcoded rather than read from settings. It had no alias at
  # all until this entry; without one, phase 2 has nowhere to point it.
  - model_name: parse-role-intent
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: end-state
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # ── The three realtime voice pipelines ───────────────────────────────────
  # All three were one setting (voice-agent Settings.voice_llm_model, and before
  # phase 7 voice_anthropic_model = claude-sonnet-4-5-20250929, never overridden
  # in .env). Sonnet tier is preserved; the version carries the same deliberate
  # phase-1 bump to sonnet-5 that every other alias here took. They are split so
  # one voice workload can be repointed — at a local model, a cheaper tier —
  # without dragging the other two with it. That independence is the deliverable
  # of this migration; they resolve to the same model today, so the split changes
  # what is POSSIBLE, not what happens.

  # v2 intake (main.py) and v1 intake. SENDS TOOLS (INTAKE_TOOLS). An alias
  # without native function calling DISABLES intake rather than degrading it:
  # streaming and emulated tools do not compose, so the emulated JSON arrives as
  # plain text and is never parsed into a tool call.
  - model_name: voice-intake
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # The screening agent (main.py, ALL_SCREENING_TOOLS). SENDS TOOLS — the same
  # native-function-calling warning as voice-intake above applies here.
  - model_name: voice-screening
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # Feedback v1 and feedback v2/RTVI. Sends no tools.
  - model_name: voice-feedback
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: feedback-condense
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: context-synthesize
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # --- Per-call tier aliases for the two hand-rolled httpx clients ------------
  # workers/feedback-agent and workers/intake-agent each choose between haiku and
  # sonnet per call (`call_haiku` / `call_sonnet`, model switch at
  # src/clients/anthropic.py:41-43). One alias per service cannot express that,
  # so each gets a pair and the caller picks the alias where it used to pick a
  # model id. HAIKU tiers mirror each service's config/settings.py defaults exactly.
  # SONNET tiers deliberately do not: the operator specified claude-sonnet-5, so
  # every sonnet alias here is a conscious upgrade from the claude-sonnet-4-6 the
  # replaced code used. That is intended, not drift.
  - model_name: feedback-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: feedback-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: intake-agent-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: intake-agent-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # --- Smoke-test aliases: one per provider, used by the cross-provider suite ---
  - model_name: smoke-anthropic
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {supports_function_calling: true}

  # The only openai-provider entry in this file, and the cross-provider smoke
  # test — repointing a workload at another provider is what this whole gateway
  # exists to make possible, so this alias is how that stays honest.
  #
  # temperature is DECLARED UNSUPPORTED here, and it is load-bearing. GPT-5
  # reasoning models accept only the default (1): sending 0 returns
  #   400 "Unsupported value: 'temperature' does not support 0 with this model."
  # NINE call sites across this repo send temperature=0 (candidate_detection,
  # end_state, coverage_tracker, both worker llm clients, feedback-agent's api
  # server, parse_jd, synthesize), so without this every one of them 400s the
  # moment its alias is pointed at an openai reasoning model.
  #
  # THREE things that DO NOT work, all tried against the running proxy — do not
  # "simplify" this into any of them:
  #   * `litellm_settings.drop_params: true` (already set globally). It drops
  #     params a provider does not SUPPORT; openai supports temperature, it is
  #     the VALUE that is rejected, so drop_params never considers it.
  #   * `litellm_params: {temperature: 1}`. Those are DEFAULTS — an explicit
  #     temperature=0 in the request overrides them and the 400 survives.
  #   * `model_info: {supported_openai_params: [...]}`. Not honoured for dropping
  #     on this path either; the 400 survives unchanged.
  # `additional_drop_params` is the one that works: it removes the named params
  # from the request for THIS deployment only, before it reaches openai.
  #
  # The determinism the call sites ask for with 0 is not lost here — it is
  # unavailable on these models at all. Anthropic and ollama aliases still honour
  # temperature=0 normally; nothing outside this entry changes.
  - model_name: smoke-openai
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
      additional_drop_params: ["temperature"]
    model_info: {supports_function_calling: true}

  - model_name: smoke-local
    litellm_params:
      model: ollama_chat/gemma4:latest
      api_base: os.environ/OLLAMA_API_BASE
    model_info: {supports_function_calling: false}

  - model_name: gemma-local
    litellm_params:
      model: ollama_chat/gemma4:latest
      api_base: os.environ/OLLAMA_API_BASE
    model_info: {supports_function_calling: false}

  # --- OpenRouter: the fourth provider, and the open-weight spike -------------
  # OpenRouter fronts ~414 models behind one key, 346 of which advertise `tools`
  # in the `supported_parameters` array of https://openrouter.ai/api/v1/models.
  # That array is what makes "pick any model" safe to offer: it is the only
  # machine-readable answer to the question `model_info.supports_function_calling`
  # asks, and getting that flag wrong in the `true` direction makes a streaming
  # workload stop recording answers with NO visible error (see llm-core's
  # capabilities.py, which fails OPEN — it defaults to true on uncertainty).
  #
  # The five below are the open-weight spike set: one flagship per major family,
  # every one of them advertising `tools` AND `response_format`. They are here to
  # be measured, not to serve traffic — no workload alias points at them.
  #
  # MEASURED 2026-08-17 against llm-core/tests/integration/test_gateway_live.py
  # (text / native tools with typed args / streaming / multi-tool routing), three
  # consecutive passes, 20 of 20 each, plus temperature=0 on all five. Total spend
  # for the whole exercise: $0.02.
  #
  #   model                        tools  stream  temp=0  quirk
  #   deepseek/deepseek-v4-flash    ok     ok      ok     none
  #   qwen/qwen3.8-27b              ok     ok      ok     reasoning effort low
  #   z-ai/glm-5.2                  ok     ok      ok     reasoning disabled
  #   meta-llama/llama-4-maverick   ok     ok      ok     none
  #   moonshotai/kimi-k2.6          ok     ok      ok     reasoning disabled
  #
  # THE REASONING QUIRK IS THE FINDING, and it is not optional. A reasoning model
  # spends `max_tokens` on hidden reasoning BEFORE emitting content, so a call
  # site asking for 64 tokens gets `finish_reason: length` and an EMPTY string —
  # the failure this repo already knows as a degraded reply that reads like a real
  # answer. It fires stochastically, so it passes a single manual test and breaks
  # in production. Measured on glm-5.2: 77 reasoning tokens before 3 of content.
  #
  # Derive it from the catalogue's `reasoning` object, never by hand:
  #   reasoning.default_enabled is falsy      -> no quirk (deepseek, llama)
  #   a low effort tier exists                -> reasoning: {effort: <lowest>}
  #   default_enabled but no low tier         -> reasoning: {enabled: false}
  #
  # Prefer the low tier over disabling: turning reasoning OFF entirely cost
  # qwen3.8-27b its multi-tool routing (4/5 correct, one reply with no tool call
  # at all), while effort:low restored it to 5/5. `mandatory: false` on all five
  # is what makes disabling legal at all — a model with mandatory reasoning must
  # get the token budget instead.
  #
  # Unlike openai/, none of these needed additional_drop_params: all five accept
  # temperature=0, so the nine call sites that send it are safe here.
  - model_name: smoke-openrouter
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: or-deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: or-qwen
    litellm_params:
      model: openrouter/qwen/qwen3.8-27b
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning: {effort: low}
    model_info: {supports_function_calling: true}

  - model_name: or-glm
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning: {enabled: false}
    model_info: {supports_function_calling: true}

  - model_name: or-llama
    litellm_params:
      model: openrouter/meta-llama/llama-4-maverick
      api_key: os.environ/OPENROUTER_API_KEY
    model_info: {supports_function_calling: true}

  - model_name: or-kimi
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.6
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning: {enabled: false}
    model_info: {supports_function_calling: true}

litellm_settings:
  drop_params: true        # silently drop params a provider does not accept
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
