[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    knit_live: live tests against the real Knit API (need KNIT_LIVE_TESTS=1, KNIT_LIVE_API_KEY, KNIT_TEST_INTEGRATION_ID); excluded from CI
# Coverage gate (ratchet floor). Owner-approved bar is >=85% global coverage
# with the calendar-intelligence background worker omitted from the denominator
# (see .coveragerc for the omit + justification). Measured 85.5% (2168 tests
# green) on 2026-06-02. --cov-config=.coveragerc is wired here so the worker
# omit applies in CI + local identically. Ratchet this number UP as coverage
# improves; never down.
addopts = --cov-config=.coveragerc --cov-fail-under=85
