name: openrecruiting

services:
  # WebRTC voice agent (intake / screening / feedback calls).
  #
  # Upstream ran this with network_mode: host, which does not work on Docker
  # Desktop for macOS or Windows. Explicit port mappings are used instead: the
  # signalling port plus a bounded UDP range for WebRTC media. On Linux you can
  # restore host networking (lower media latency, no range to maintain) with:
  #   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
  voice-agent:
    build:
      context: .
      dockerfile: voice-agent/Dockerfile
    ports:
      - "8011:8011"
      - "40000-40010:40000-40010/udp"
    env_file: [.env]
    extra_hosts: ["host.docker.internal:host-gateway"]
    # The intake coverage tracker calls the gateway from phase 3 onward.
    # LLM_GATEWAY_URL / LITELLM_MASTER_KEY already arrive via env_file.
    depends_on: [litellm]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # The page the meeting bot opens as its camera feed.
  voice-frontend:
    build:
      context: ./voice-frontend
    ports: ["3003:3000"]
    env_file: [.env]
    restart: unless-stopped

  # Recruiting knowledge graph.
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/openrecruiting}
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USERNAME:-neo4j} -p $${NEO4J_PASSWORD:-openrecruiting} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  cortex-backend:
    build:
      context: ./cortex-backend
    ports: ["8010:8010"]
    env_file: [.env]
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # MCP resource server. Validates tokens against the backend's JWKS.
  cortex-mcp:
    build:
      context: ./cortex-mcp
    ports: ["8020:8020"]
    env_file: [.env]
    depends_on: [cortex-backend]
    restart: unless-stopped

  # Login lives here; it sets the shared cookie the recruiter app reads.
  landing:
    # No build args: browser config is read at request time from env_file.
    build:
      context: ./landing
    ports: ["3000:3000"]
    env_file: [.env]
    restart: unless-stopped

  recruiter-app:
    # No build args: browser config is read at request time from env_file below,
    # not baked into the image. See recruiter-app/src/lib/runtime-config.ts.
    build:
      context: ./recruiter-app
    ports: ["3005:3000"]
    env_file: [.env]
    restart: unless-stopped

  # Staff-only admin portal: customers, subscriptions, promotions, blog,
  # assessments. Gated on profiles.is_staff -- see docs/security.md. It holds
  # its own session cookie (openrecruiting-admin-auth), deliberately separate
  # from the recruiter app's, so signing into one is not signing into the other.
  admin-app:
    # No build args: browser config is read at request time from env_file.
    build:
      context: ./admin-app
    ports: ["3001:3000"]
    env_file: [.env]
    restart: unless-stopped

  # Single egress point for text generation. Applications send an alias; this
  # resolves it to a provider. See litellm-config.yaml.
  litellm:
    # Pinned by digest, not to :main-latest. Every service's text generation
    # egresses through this one container, so a floating tag would let an
    # unrelated `docker compose pull` swap the gateway underneath the whole
    # stack. This digest is the multi-arch index for :main-latest as of
    # 2026-08-08. To bump it deliberately:
    #   docker buildx imagetools inspect ghcr.io/berriai/litellm:main-latest
    # then paste the reported Digest here and re-run `make verify`.
    image: ghcr.io/berriai/litellm@sha256:76d036d18bb352ac3b4e0a84d5892b2cb2fe472e305bf2ac0619aef97fe6ced0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    ports: ["4000:4000"]
    env_file: [.env]
    # Lets the container reach an Ollama server running on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8004:8004"]
    env_file: [.env]
    # Lets the container reach services running on the host (e.g. a tunnel).
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [feedback-agent, intake-agent, intake-context-builder, litellm]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # The three workers below were AWS Lambdas. The backend reaches them over HTTP
  # when JOB_INVOKER=http; they are not published to the host.
  feedback-agent:
    build:
      context: .
      dockerfile: workers/feedback-agent/Dockerfile
    expose: ["9001"]
    env_file: [.env]
    # Both LLM paths go through the gateway from phases 5-6.
    depends_on: [litellm]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  intake-agent:
    build:
      context: .
      dockerfile: workers/intake-agent/Dockerfile
    expose: ["9002"]
    env_file: [.env]
    # Both LLM paths go through the gateway from phases 5-6.
    depends_on: [litellm]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  intake-context-builder:
    build:
      context: .
      dockerfile: workers/intake-context-builder/Dockerfile
    expose: ["9003"]
    env_file: [.env]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Self-host setup UI ───────────────────────────────────────────────────
  # Always boots, with no dependencies, so it is reachable on a completely
  # unconfigured stack — that is the whole point. It owns .env and
  # litellm-config.yaml as FILES (still hand-editable) and restarts only the
  # containers a change affects.
  #
  # Bound to 127.0.0.1 deliberately: it can edit every secret in the deployment
  # and restart containers, so it must not be reachable from a network. Remote
  # operators tunnel: ssh -L 3010:localhost:3010 user@host
  setup-ui:
    build:
      context: .
      dockerfile: setup-ui/Dockerfile
    ports: ["127.0.0.1:3010:3010"]
    environment:
      SETUP_ENV_PATH: /repo/.env
      SETUP_ENV_EXAMPLE_PATH: /repo/.env.example
      SETUP_STATE_PATH: /state/password.json
      SETUP_DOCKER_PROXY: http://socket-proxy:2375
    volumes:
      # The repo ROOT, not the individual files. Bind-mounting a single FILE
      # pins its inode, so os.replace() onto it fails with EBUSY — atomic writes
      # need the containing directory to be the mount. Found by saving a setting
      # and watching it fail: "Device or resource busy: '/repo/.env.1.tmp' ->
      # '/repo/.env'". Writing in place instead would drop atomicity, and a
      # half-written .env takes down every container on its next restart.
      #
      # setup-ui only ever writes the two paths named in its environment above;
      # SETUP_ENV_PATH and the litellm config are the only targets in the code.
      - ./:/repo
      - setup-ui-state:/state
    depends_on: [socket-proxy]
    restart: unless-stopped

  # The ONLY container that sees the Docker socket, and the one piece of this
  # design that has to be exactly right. /var/run/docker.sock is root-equivalent
  # on the host: anything that can reach it can create a privileged container
  # bind-mounting /, which is a full host compromise. setup-ui therefore never
  # gets the socket — it gets an HTTP endpoint that permits exactly two calls.
  #
  # DO NOT swap this for tecnativa/docker-socket-proxy with POST=1. That was the
  # first implementation and it is NOT safe for this use: its POST flag is a
  # blanket allow across every enabled path group, so POST /containers/create is
  # permitted. Verified against the running proxy, not assumed — a well-formed
  # privileged create with "Binds": ["/:/host"] returned 201 and the container
  # was really created. Per-endpoint flags like EXEC=0 gate path PREFIXES and do
  # not help, because /containers/create lives under CONTAINERS=1.
  #
  # wollomatic/socket-proxy takes a regex allowlist of METHOD|PATH instead, so
  # "list containers" and "restart THIS container by id" can be permitted while
  # create, exec, images, volumes, networks and everything else are refused by
  # default rather than by omission.
  socket-proxy:
    image: wollomatic/socket-proxy:1
    command:
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      - '-allowfrom=setup-ui'
      # GET  /v1.xx/containers/json          -> the health grid
      # POST /v1.xx/containers/<id>/restart  -> apply a config change
      - '-allowGET=/v[\d\.]+/containers/json'
      - '-allowPOST=/v[\d\.]+/containers/[a-zA-Z0-9_.-]+/restart'
      - '-watchdoginterval=600'
      - '-stoponwatchdog=false'
      - '-shutdowngracetime=5'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose: ["2375"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
    # Runs as nobody, in the group that owns the socket. That gid is
    # host-specific and must be read from INSIDE a container, not from the host:
    # on Docker Desktop the host shows gid 1 while the container sees root:root
    # (gid 0), because the socket is proxied into the VM. On Linux it is the
    # docker group, typically 999 or 998. Find yours with:
    #   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
    #     alpine stat -c '%g' /var/run/docker.sock
    # Then export DOCKER_SOCKET_GID before `docker compose up`.
    user: "65534:${DOCKER_SOCKET_GID:-0}"
    restart: unless-stopped

  # ── Public access: one hostname, path-routed ─────────────────────────────
  # Only reachable from inside the compose network and via the tunnel. No host
  # port is published, so running this does NOT expose anything by itself —
  # cloudflared below is what makes it public, and only while it runs.
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    expose: ["80"]
    restart: unless-stopped

  # Outbound-only connection to Cloudflare. Opens no inbound ports on your
  # machine or router — the tunnel dials out and Cloudflare routes back down it.
  # Set CLOUDFLARE_TOKEN in .env; with it unset this container simply idles,
  # which keeps `docker compose up` working on an unconfigured install.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN:-}
    depends_on: [caddy]
    restart: unless-stopped

networks:
  default:
    name: openrecruiting

volumes:
  neo4j-data:
  setup-ui-state:
