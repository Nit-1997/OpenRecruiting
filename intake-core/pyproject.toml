[project]
name = "intake-core"
version = "0.1.0"
description = "Shared intake agent state, prompts, and tools for v2 voice + text"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
    "supabase>=2.5,<3.0",
    "structlog>=24.1,<26.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["intake_core*"]
